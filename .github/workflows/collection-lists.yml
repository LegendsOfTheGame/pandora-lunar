# Rebuilds collection-lists.js from FFXIV Collect once a day, so a new PvP season's
# mounts or a patch's minions reach the Ledger without anyone doing anything.
# The page never calls Collect itself: visitors only ever load this repo's file.
name: Collection lists

on:
  schedule:
    - cron: "17 16 * * *"   # daily 16:17 UTC, after the usual maintenance window ends
  workflow_dispatch:         # run by hand from the Actions tab after a patch

permissions:
  contents: write

concurrency:
  group: collection-lists
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the list file
        run: python tools/build_collection_lists.py collection-lists.js

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- collection-lists.js && git ls-files --error-unmatch collection-lists.js >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection-lists.js
          git commit -m "data: refresh collection lists from FFXIV Collect"
          git push
